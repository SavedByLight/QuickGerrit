name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Shared version metadata
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.v.outputs.version_code }}
      version_name: ${{ steps.v.outputs.version_name }}
      tag: ${{ steps.v.outputs.tag }}
      subject: ${{ steps.c.outputs.subject }}
      body: ${{ steps.c.outputs.body }}
      short: ${{ steps.c.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: v
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME} (code ${CODE})"
      - id: c
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          SHORT=$(git log -1 --pretty=%h)
          {
            echo "subject<<EOF"
            echo "$SUBJECT"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
            echo "short=${SHORT}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------------
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Using secrets keystore"
          elif [ -f app/ci.keystore ]; then
            echo "Using committed CI keystore"
          else
            echo "WARNING: no keystore found"
          fi

      - name: Build Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug \
            -PversionCode=${{ needs.version.outputs.version_code }} \
            -PversionName=${{ needs.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find composeApp/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          cp "$APK" dist/QuickGerrit-debug.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/QuickGerrit-debug.apk
          if-no-files-found: error

      - if: always()
        run: rm -f app/release.keystore

  # ---------------------------------------------------------------------------
  # Desktop Linux: DEB, RPM, AppImage
  # ---------------------------------------------------------------------------
  desktop-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            fakeroot rpm libfuse2 binutils || true

      - name: Build Deb / Rpm / AppImage
        run: |
          V="${{ needs.version.outputs.version_name }}"
          REPO="${{ github.repository }}"
          set +e
          ./gradlew :composeApp:packageDeb \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
          DEB_RC=$?
          ./gradlew :composeApp:packageRpm \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
          RPM_RC=$?
          ./gradlew :composeApp:packageAppImage \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
          AI_RC=$?
          # Fallback single task if individual targets fail
          if [ $DEB_RC -ne 0 ] || [ $RPM_RC -ne 0 ] || [ $AI_RC -ne 0 ]; then
            ./gradlew :composeApp:packageDistributionForCurrentOS \
              -PversionName="$V" -PgithubRepo="$REPO" --stacktrace || true
          fi
          set -e
          echo "Exit codes: deb=$DEB_RC rpm=$RPM_RC appimage=$AI_RC"

      - name: Stage Linux packages
        run: |
          mkdir -p dist
          find composeApp/build -type f \( \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
          \) -print -exec cp -v {} dist/ \; 2>/dev/null || true
          echo "=== staged ==="
          ls -la dist/ || true
          # Fail the job if nothing was produced so the release does not
          # silently ship Android-only again
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No desktop Linux packages produced. Check composeApp packaging."
            find composeApp/build -type f 2>/dev/null | head -50 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Desktop Windows: MSI
  # ---------------------------------------------------------------------------
  desktop-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        shell: bash
        run: |
          V="${{ needs.version.outputs.version_name }}"
          REPO="${{ github.repository }}"
          chmod +x gradlew || true
          set +e
          ./gradlew :composeApp:packageMsi \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
          RC=$?
          if [ $RC -ne 0 ]; then
            ./gradlew :composeApp:packageDistributionForCurrentOS \
              -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
            RC=$?
          fi
          set -e
          exit $RC

      - name: Stage MSI
        shell: bash
        run: |
          mkdir -p dist
          find composeApp/build -type f -name "*.msi" -print -exec cp -v {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No MSI produced"
            find composeApp/build -type f 2>/dev/null | head -50 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release — attach every artifact
  # ---------------------------------------------------------------------------
  release:
    needs: [version, android, desktop-linux, desktop-windows]
    # Release even if one desktop job fails, as long as Android succeeded
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p dist
          find artifacts -type f \( \
            -name "*.apk" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" \
          \) -print -exec cp -v {} dist/ \;
          echo "=== release contents ==="
          ls -la dist/
          if [ ! -f dist/QuickGerrit-debug.apk ]; then
            echo "ERROR: APK missing from release set"
            exit 1
          fi
          COUNT=$(find dist -type f | wc -l)
          echo "Total files for release: $COUNT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: QuickGerrit ${{ needs.version.outputs.version_name }}
          body: |
            ## QuickGerrit ${{ needs.version.outputs.version_name }}

            **Last commit:** `${{ needs.version.outputs.short }}` on `${{ github.ref_name }}`

            ### ${{ needs.version.outputs.subject }}

            ${{ needs.version.outputs.body }}

            ---

            ### Downloads

            | Platform | Asset |
            |----------|--------|
            | **Android** | `QuickGerrit-debug.apk` |
            | **Linux (Debian/Ubuntu)** | `*.deb` |
            | **Linux (Fedora/RHEL)** | `*.rpm` |
            | **Linux (portable)** | `*.AppImage` |
            | **Windows** | `*.msi` |

            Android APK keeps the same package id and signing cert so updates install in place.
            Desktop packages are built from `:composeApp` (Compose Multiplatform).
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
