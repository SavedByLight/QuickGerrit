name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          # versionCode = run number (monotonic), versionName = 1.0.<run>
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME} (code ${CODE})"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Keystore decoded — release builds will be signed"
          else
            echo "No KEYSTORE_BASE64 secret — release APK will be unsigned"
          fi

      - name: Build debug + release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$DEBUG_APK" "dist/QuickGerrit-${{ steps.version.outputs.version_name }}-debug.apk"
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "dist/QuickGerrit-${{ steps.version.outputs.version_name }}-release.apk"
          fi
          # Also keep stable names for "latest" consumers / auto-updater
          cp "$DEBUG_APK" dist/QuickGerrit-debug.apk
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" dist/QuickGerrit-release.apk
          fi
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickGerrit-${{ steps.version.outputs.version_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuickGerrit ${{ steps.version.outputs.version_name }}
          body: |
            ## QuickGerrit ${{ steps.version.outputs.version_name }}

            Automated build from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            ### Assets
            | File | Description |
            |------|-------------|
            | `QuickGerrit-release.apk` | Release build (preferred for daily use) |
            | `QuickGerrit-debug.apk` | Debug build (logging enabled) |
            | `QuickGerrit-*-release.apk` | Versioned release APK |
            | `QuickGerrit-*-debug.apk` | Versioned debug APK |

            The in-app updater checks this release feed automatically.
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore
