name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Android APK (original :app module + optional composeApp Android)
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      tag: ${{ steps.version.outputs.tag }}
      subject: ${{ steps.commit.outputs.subject }}
      body: ${{ steps.commit.outputs.body }}
      short: ${{ steps.commit.outputs.short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME} (code ${CODE})"

      - name: Capture last commit
        id: commit
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          SHORT=$(git log -1 --pretty=%h)
          FULL=$(git log -1 --pretty=%H)
          {
            echo "subject<<EOF"
            echo "$SUBJECT"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
            echo "short=${SHORT}"
            echo "full=${FULL}"
          } >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Using secrets keystore (release.keystore)"
          elif [ -f app/ci.keystore ]; then
            echo "Using committed CI keystore (app/ci.keystore) — same cert every run"
          else
            echo "WARNING: no keystore found; continuing without signed release cert"
          fi

      - name: Build Android debug APK (:app)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace || {
              echo "WARN: :app:assembleDebug failed — trying composeApp Android if present"
              ./gradlew :composeApp:assembleDebug \
                -PversionCode=${{ steps.version.outputs.version_code }} \
                -PversionName=${{ steps.version.outputs.version_name }} \
                -PgithubRepo=${{ github.repository }} \
                --stacktrace || true
            }

      - name: Package Android APK
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$DEBUG_APK" ]; then
            DEBUG_APK=$(find composeApp/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: no debug APK found"
            find . -path '*/build/outputs/apk/*' -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          cp "$DEBUG_APK" dist/QuickGerrit-debug.apk
          echo "=== APK signing cert ==="
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs dist/QuickGerrit-debug.apk 2>/dev/null \
            || echo "(could not print cert)"
          ls -la dist/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/QuickGerrit-debug.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore

  # ---------------------------------------------------------------------------
  # Desktop packages (Linux: Deb, Rpm, AppImage)
  # ---------------------------------------------------------------------------
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: android   # reuse version outputs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install packaging tools (fakeroot, rpm, etc.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot rpm libfuse2 || true

      - name: Build desktop distributions (Deb, Rpm, AppImage)
        run: |
          VERSION="${{ needs.android.outputs.version_name }}"
          echo "Building desktop packages for version $VERSION"

          # Prefer explicit targets so we get all three on Linux
          ./gradlew :composeApp:packageDeb \
            -PversionName="$VERSION" \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace || echo "WARN: packageDeb failed"

          ./gradlew :composeApp:packageRpm \
            -PversionName="$VERSION" \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace || echo "WARN: packageRpm failed"

          ./gradlew :composeApp:packageAppImage \
            -PversionName="$VERSION" \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace || echo "WARN: packageAppImage failed"

          # Fallback: current-OS distribution if individual targets unavailable
          ./gradlew :composeApp:packageDistributionForCurrentOS \
            -PversionName="$VERSION" \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace || true

      - name: Collect desktop packages
        run: |
          mkdir -p dist
          # Compose Desktop puts packages under build/compose/binaries/...
          find composeApp/build/compose/binaries -type f \( \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.dmg" \
          \) -exec cp -v {} dist/ \; 2>/dev/null || true

          # Also check other common locations
          find composeApp/build -type f \( \
            -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \
          \) -exec cp -v {} dist/ \; 2>/dev/null || true

          ls -la dist/ || true
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "WARNING: no desktop packages produced (composeApp may still need platform adapters)"
          fi

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Desktop package (Windows: MSI)
  # ---------------------------------------------------------------------------
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    needs: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        shell: bash
        run: |
          VERSION="${{ needs.android.outputs.version_name }}"
          echo "Building MSI for version $VERSION"
          ./gradlew :composeApp:packageMsi \
            -PversionName="$VERSION" \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace || {
              echo "WARN: packageMsi failed — trying packageDistributionForCurrentOS"
              ./gradlew :composeApp:packageDistributionForCurrentOS \
                -PversionName="$VERSION" \
                -PgithubRepo=${{ github.repository }} \
                --stacktrace || true
            }

      - name: Collect MSI
        shell: bash
        run: |
          mkdir -p dist
          find composeApp/build/compose/binaries -type f -name "*.msi" -exec cp -v {} dist/ \; 2>/dev/null || true
          find composeApp/build -type f -name "*.msi" -exec cp -v {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*.msi
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [android, desktop-linux, desktop-windows]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare dist
        run: |
          mkdir -p dist
          find artifacts -type f \( \
            -name "*.apk" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" \
          \) -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.android.outputs.tag }}
          name: QuickGerrit ${{ needs.android.outputs.version_name }}
          body: |
            ## QuickGerrit ${{ needs.android.outputs.version_name }}

            **Last commit:** `${{ needs.android.outputs.short }}` on `${{ github.ref_name }}`

            ### ${{ needs.android.outputs.subject }}

            ${{ needs.android.outputs.body }}

            ---

            ### Downloads

            | Platform | Asset |
            |----------|--------|
            | **Android** | `QuickGerrit-debug.apk` |
            | **Linux (Debian/Ubuntu)** | `*.deb` |
            | **Linux (Fedora/RHEL)** | `*.rpm` |
            | **Linux (portable)** | `*.AppImage` |
            | **Windows** | `*.msi` |

            Android APK keeps the same package id and signing cert across releases so updates install in place.
            Desktop packages are produced by Compose Multiplatform (`:composeApp`).
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
