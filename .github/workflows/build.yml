name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Shared version metadata
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.v.outputs.version_code }}
      version_name: ${{ steps.v.outputs.version_name }}
      tag: ${{ steps.v.outputs.tag }}
      subject: ${{ steps.c.outputs.subject }}
      body: ${{ steps.c.outputs.body }}
      short: ${{ steps.c.outputs.short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: v
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME} (code ${CODE})"
      - id: c
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          SHORT=$(git log -1 --pretty=%h)
          {
            echo "subject<<EOF"
            echo "$SUBJECT"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
            echo "short=${SHORT}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------------
  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Using secrets keystore"
          elif [ -f app/ci.keystore ]; then
            echo "Using committed CI keystore"
          else
            echo "WARNING: no keystore found"
          fi

      - name: Build Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug \
            -PversionCode=${{ needs.version.outputs.version_code }} \
            -PversionName=${{ needs.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find composeApp/build/outputs/apk -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found"
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          cp "$APK" dist/QuickGerrit-debug.apk
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/QuickGerrit-debug.apk
          if-no-files-found: error

      - if: always()
        run: rm -f app/release.keystore

  # ---------------------------------------------------------------------------
  # Desktop Linux: DEB, RPM, AppImage
  # ---------------------------------------------------------------------------
  desktop-linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            fakeroot rpm binutils wget file \
            libfuse2t64 2>/dev/null \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            fakeroot rpm binutils wget file libfuse2 || true
          # Real .AppImage builder (Compose TargetFormat.AppImage ≠ Linux AppImage)
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" \
            || curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool

      - name: Build Deb and Rpm
        run: |
          V="${{ needs.version.outputs.version_name }}"
          REPO="${{ github.repository }}"
          ./gradlew :composeApp:packageDeb \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
          ./gradlew :composeApp:packageRpm \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace

      - name: Create Linux distributable (for AppImage)
        run: |
          V="${{ needs.version.outputs.version_name }}"
          REPO="${{ github.repository }}"
          # Unpacked JVM app tree used as AppImage payload
          ./gradlew :composeApp:createDistributable \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace

      - name: Build real AppImage with appimagetool
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          V="${{ needs.version.outputs.version_name }}"
          mkdir -p dist

          APP_DIR=""
          for cand in \
            composeApp/build/compose/binaries/main/app/QuickGerrit \
            composeApp/build/compose/binaries/main/appimage/QuickGerrit \
            composeApp/build/compose/binaries/main/app/* \
            composeApp/build/compose/binaries/main-release/app/QuickGerrit \
            composeApp/build/compose/binaries/main-release/app/*
          do
            if [ -d "$cand" ] && { [ -d "$cand/bin" ] || [ -d "$cand/lib" ]; }; then
              APP_DIR="$cand"
              break
            fi
          done

          if [ -z "$APP_DIR" ]; then
            echo "Searching for app directory..."
            APP_DIR=$(find composeApp/build/compose/binaries -type d -name "bin" 2>/dev/null | head -1 | xargs -r dirname)
          fi

          echo "APP_DIR=$APP_DIR"
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "::warning::No Compose app directory found — skipping AppImage"
            find composeApp/build/compose -maxdepth 5 -type d 2>/dev/null | head -40 || true
            exit 0
          fi

          WORK="${RUNNER_TEMP:-/tmp}/QuickGerrit.AppDir"
          rm -rf "$WORK"
          mkdir -p "$WORK/usr"
          cp -a "$APP_DIR"/. "$WORK/usr/"

          # Write AppRun without breaking YAML indentation (use printf, not unindented heredoc)
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'if [ -d "$HERE/usr/bin" ]; then' \
            '  for f in "$HERE/usr/bin"/*; do' \
            '    [ -f "$f" ] && [ -x "$f" ] && exec "$f" "$@"' \
            '  done' \
            'fi' \
            'BIN=$(find "$HERE/usr" -maxdepth 3 -type f -executable 2>/dev/null | head -1)' \
            'exec "$BIN" "$@"' \
            > "$WORK/AppRun"
          chmod +x "$WORK/AppRun"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=QuickGerrit' \
            'Comment=Gerrit Code Review client' \
            'Exec=AppRun' \
            'Icon=quickgerrit' \
            'Categories=Development;' \
            'Terminal=false' \
            > "$WORK/quickgerrit.desktop"

          # Minimal 1x1 PNG as icon placeholder
          python3 -c "import pathlib; pathlib.Path('$WORK/quickgerrit.png').write_bytes(bytes.fromhex('89504e470d0a1a0a0000000d4948445200000001000000010802000000907753de0000000c49444154789c63f80f00000101000518d84e0000000049454e44ae426082'))"

          OUT="dist/QuickGerrit-${V}-x86_64.AppImage"
          /tmp/appimagetool "$WORK" "$OUT" || /tmp/appimagetool --no-appstream "$WORK" "$OUT"
          ls -la dist/ || true
          if [ -f "$OUT" ]; then
            echo "AppImage created: $OUT"
            chmod +x "$OUT"
          else
            echo "::warning::appimagetool did not produce $OUT"
          fi

      - name: Stage Linux packages
        run: |
          mkdir -p dist
          find composeApp/build -type f \( -name "*.deb" -o -name "*.rpm" \) -print -exec cp -v {} dist/ \; 2>/dev/null || true
          echo "=== staged ==="
          ls -la dist/ || true
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No desktop Linux packages produced. Check composeApp packaging."
            find composeApp/build -type f 2>/dev/null | head -50 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Desktop Windows: MSI
  # ---------------------------------------------------------------------------
  desktop-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build MSI
        shell: bash
        run: |
          V="${{ needs.version.outputs.version_name }}"
          REPO="${{ github.repository }}"
          chmod +x gradlew || true
          set +e
          ./gradlew :composeApp:packageMsi \
            -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
          RC=$?
          if [ $RC -ne 0 ]; then
            ./gradlew :composeApp:packageDistributionForCurrentOS \
              -PversionName="$V" -PgithubRepo="$REPO" --stacktrace
            RC=$?
          fi
          set -e
          exit $RC

      - name: Stage MSI
        shell: bash
        run: |
          mkdir -p dist
          find composeApp/build -type f -name "*.msi" -print -exec cp -v {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No MSI produced"
            find composeApp/build -type f 2>/dev/null | head -50 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release — attach every artifact
  # ---------------------------------------------------------------------------
  release:
    needs: [version, android, desktop-linux, desktop-windows]
    # Release even if one desktop job fails, as long as Android succeeded
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        run: |
          mkdir -p dist
          find artifacts -type f \( \
            -name "*.apk" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" \
          \) -print -exec cp -v {} dist/ \;
          echo "=== release contents ==="
          ls -la dist/
          if [ ! -f dist/QuickGerrit-debug.apk ]; then
            echo "ERROR: APK missing from release set"
            exit 1
          fi
          COUNT=$(find dist -type f | wc -l)
          echo "Total files for release: $COUNT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: QuickGerrit ${{ needs.version.outputs.version_name }}
          body: |
            ## QuickGerrit ${{ needs.version.outputs.version_name }}

            **Last commit:** `${{ needs.version.outputs.short }}` on `${{ github.ref_name }}`

            ### ${{ needs.version.outputs.subject }}

            ${{ needs.version.outputs.body }}

            ---

            ### Downloads

            | Platform | Asset |
            |----------|--------|
            | **Android** | `QuickGerrit-debug.apk` |
            | **Linux (Debian/Ubuntu)** | `*.deb` |
            | **Linux (Fedora/RHEL)** | `*.rpm` |
            | **Linux (portable)** | `*.AppImage` |
            | **Windows** | `*.msi` |

            Android APK keeps the same package id and signing cert so updates install in place.
            Desktop packages are built from `:composeApp` (Compose Multiplatform).
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
