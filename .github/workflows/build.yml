name: Build & Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full commit message for the release notes
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute version
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME} (code ${CODE})"

      - name: Capture last commit
        id: commit
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          SHORT=$(git log -1 --pretty=%h)
          FULL=$(git log -1 --pretty=%H)
          {
            echo "subject<<EOF"
            echo "$SUBJECT"
            echo "EOF"
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
            echo "short=${SHORT}"
            echo "full=${FULL}"
          } >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Using secrets keystore (release.keystore)"
          elif [ -f app/ci.keystore ]; then
            echo "Using committed CI keystore (app/ci.keystore) — same cert every run"
          else
            echo "ERROR: no keystore available; APKs would not share a signing cert"
            exit 1
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }} \
            -PgithubRepo=${{ github.repository }} \
            --stacktrace

      - name: Package single APK
        run: |
          mkdir -p dist
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: debug APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi

          # One stable asset name for in-app updates (BuildConfig.UPDATE_APK_NAME)
          cp "$DEBUG_APK" dist/QuickGerrit-debug.apk

          echo "=== APK signing cert ==="
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs dist/QuickGerrit-debug.apk 2>/dev/null \
            || echo "(could not print cert)"

          ls -la dist/

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: QuickGerrit ${{ steps.version.outputs.version_name }}
          body: |
            ## QuickGerrit ${{ steps.version.outputs.version_name }}

            **Last commit:** `${{ steps.commit.outputs.short }}` on `${{ github.ref_name }}`

            ### ${{ steps.commit.outputs.subject }}

            ${{ steps.commit.outputs.body }}

            ---
            Install **`QuickGerrit-debug.apk`**. Same package id and signing cert across releases so Android updates in place.
          files: dist/QuickGerrit-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f app/release.keystore
